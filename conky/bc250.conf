conky.config = {
    alignment = 'top_right', gap_x = 28, gap_y = 48,
    minimum_width = 350, maximum_width = 350,
    background = false, update_interval = 1, double_buffer = true,
    use_xft = true, font = 'Noto Sans:size=10',
    draw_shades = false, draw_outline = false, draw_borders = false,
    default_color = 'F5F7FA', color1 = '5CC8FF', color2 = 'AAB7C4',
    color3 = '72E6A6', color4 = 'FFD166', color5 = 'FF6B6B', color6 = 'FFFFFF',
    no_buffers = true, cpu_avg_samples = 2, net_avg_samples = 2,
    out_to_x = true, own_window = true, own_window_type = 'dock',
    own_window_class = 'Conky', own_window_title = 'BC-250 System Monitor',
    own_window_transparent = false, own_window_argb_visual = true,
    own_window_argb_value = 185,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 20, default_bar_width = 310, default_bar_height = 9,
    default_graph_width = 310, default_graph_height = 28,
    short_units = true, pad_percents = 2,
};

conky.text = [[
${font Noto Sans:bold:size=16}${color1}BAZZITE${color6}  BC-250${font}
${font Noto Sans:size=9}${color2}SYSTEM HEALTH MONITOR${font}
${color1}${hr 2}

${font Noto Sans:bold:size=11}${color6}SYSTEM${font}
${color2}Hostname${alignr}${color6}${nodename}
${color2}Kernel${alignr}${color6}${kernel}
${color2}Uptime${alignr}${color6}${uptime_short}
${color2}Time${alignr}${color6}${time %I:%M:%S %p}

${voffset 4}${font Noto Sans:bold:size=11}${color6}PROCESSOR${font}
${color2}Usage${alignr}${color6}${cpu}%
${color1}${cpubar}
${color2}Temperature${alignr}${color3}${execi 3 ~/.config/conky/scripts/bc250-stats.sh cpu_temp}
${color2}Frequency${alignr}${color6}${freq_g} GHz
${color2}Load${alignr}${color6}${loadavg 1}

${voffset 4}${font Noto Sans:bold:size=11}${color6}GRAPHICS${font}
${color2}${execi 30 ~/.config/conky/scripts/bc250-stats.sh gpu_name}
${color2}GPU usage${alignr}${color6}${execi 2 ~/.config/conky/scripts/bc250-stats.sh gpu_usage_text}
${color1}${execibar 2 ~/.config/conky/scripts/bc250-stats.sh gpu_usage}
${color2}Temperature${alignr}${color3}${execi 3 ~/.config/conky/scripts/bc250-stats.sh gpu_temp}
${color2}Core clock${alignr}${color6}${execi 3 ~/.config/conky/scripts/bc250-stats.sh gpu_clock}

${voffset 4}${font Noto Sans:bold:size=11}${color6}MEMORY${font}
${color2}Used${alignr}${color6}${mem} / ${memmax}
${color1}${membar}
${color2}RAM usage${alignr}${color6}${memperc}%
${color2}Swap${alignr}${color6}${swap} / ${swapmax}

${voffset 4}${font Noto Sans:bold:size=11}${color6}STORAGE${font}
${color2}Volume${alignr}${color6}${execi 30 ~/.config/conky/scripts/bc250-stats.sh storage_label}
${color2}Mount${alignr}${color6}${execi 30 ~/.config/conky/scripts/bc250-stats.sh storage_mount}
${color2}Used${alignr}${color3}${execi 30 ~/.config/conky/scripts/bc250-stats.sh storage_summary}
${color3}${execibar 30 ~/.config/conky/scripts/bc250-stats.sh storage_percent}
${color2}Free space${alignr}${color6}${execi 30 ~/.config/conky/scripts/bc250-stats.sh storage_free}
${color2}Filesystem${alignr}${color6}${execi 60 ~/.config/conky/scripts/bc250-stats.sh storage_filesystem}
${color2}NVMe temperature${alignr}${color3}${execi 10 ~/.config/conky/scripts/bc250-stats.sh nvme_temp}

${voffset 4}${font Noto Sans:bold:size=11}${color6}TOP STORAGE${font}
${color2}NAME${alignr}SIZE
${color6}${execpi 300 ~/.config/conky/scripts/bc250-stats.sh storage_top}

${voffset 4}${font Noto Sans:bold:size=11}${color6}NETWORK${font}
${color2}Connection${alignr}${color6}${execi 10 ~/.config/conky/scripts/bc250-stats.sh network_type}
${color2}SSID${alignr}${color6}${execi 10 ~/.config/conky/scripts/bc250-stats.sh ssid}
${color2}Signal${alignr}${color3}${execi 5 ~/.config/conky/scripts/bc250-stats.sh signal_bar}
${color2}Interface${alignr}${color6}${execi 10 ~/.config/conky/scripts/bc250-stats.sh interface}
${color2}IP address${alignr}${color6}${execi 10 ~/.config/conky/scripts/bc250-stats.sh ip}
${color2}Download${alignr}${color3}${downspeed NETWORK_INTERFACE}/s
${color3}${downspeedgraph NETWORK_INTERFACE}
${color2}Upload${alignr}${color1}${upspeed NETWORK_INTERFACE}/s
${color1}${upspeedgraph NETWORK_INTERFACE}

${voffset 4}${font Noto Sans:bold:size=11}${color6}TOP PROCESSES${font}
${color2}PROCESS${alignr}CPU     RAM
${color6}${top name 1}${alignr}${top cpu 1}%  ${top mem 1}%
${top name 2}${alignr}${top cpu 2}%  ${top mem 2}%
${top name 3}${alignr}${top cpu 3}%  ${top mem 3}%
]];
